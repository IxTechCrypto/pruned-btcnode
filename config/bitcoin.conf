# ==============================================================================
# Bitcoin Core Configuration - Pruned Node for Orange Pi Zero 3 (1.5 GB RAM)
# ==============================================================================

# --- Node Type & Storage ---
# Enable pruning to limit storage to specified MiB (550 MiB minimum)
# 550 = absolute minimal historical storage (~1-2 GB total disk footprint)
# 5000 = ~5 GB blockchain history buffer
prune=550

# Disable expensive indexing to save CPU, RAM, and Disk IO
txindex=0
blockfilterindex=0
coinstatsindex=0

# Disable integrated wallet to conserve RAM (Node / Relay / RPC only)
disablewallet=1

# --- Memory & Cache Optimization (Tuned for 1.5 GB RAM + ZRAM) ---
# Database cache size in MiB.
# During Initial Block Download (IBD), dbcache=650 uses ~1GB RAM + ZRAM.
# Once fully synced, can be lowered to 150-250 MiB.
dbcache=650

# Maximum transaction memory pool size in MiB (Default is 300 MiB)
# Reducing to 100 MiB saves ~200MB of RAM under mempool pressure.
maxmempool=100

# Number of script verification threads (0 = auto, 1-16)
# Set to 3 to maximize 4-core Allwinner H618 throughput while leaving 1 core for OS/Web.
par=3

# Maximum peer connections (Default is 125)
# Lowering to 16-24 reduces socket buffer overhead.
maxconnections=16

# --- Network & Server ---
# Server mode enables JSON-RPC for the display daemon & CLI tools
daemon=0
server=1
listen=1
listenonion=0

# Local RPC interface
rpcport=8332
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcworkqueue=64
rpcthreads=8
rpctimeout=30

# Default auth uses ~/.bitcoin/.cookie automatically.
# Uncomment below if you prefer static RPC credentials:
# rpcuser=btcnode
# rpcpassword=ChangeThisSecurePasswordInProduction

# --- Logging & DoS Protection ---
# Limit log file size to prevent SD card wear/fill-up
maxlogsize=10
shrinkdebuglog=1
