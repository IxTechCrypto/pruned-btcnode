# ==============================================================================
# Bitcoin Core Configuration - Pruned Node for Orange Pi Zero 3 (1.5 GB RAM)
# Hardened for 24/7 Stability, Low Memory Footprint & Thermal Resilience
# ==============================================================================

# --- Node Type & Storage ---
# Enable pruning to limit storage to specified MiB (550 MiB minimum)
prune=550

# Disable expensive indexing to save CPU, RAM, and Disk IO
txindex=0
blockfilterindex=0
coinstatsindex=0

# Disable integrated wallet to conserve RAM (Node / Relay / RPC only)
disablewallet=1

# --- Memory & Cache Optimization (Tuned for 1.5 GB RAM + ZRAM) ---
# Database cache size in MiB.
# 350 MiB provides high IBD throughput while keeping total bitcoind RSS under 900 MB,
# preventing Linux kernel OOM lockups and ZRAM compression stalls.
dbcache=350

# Maximum transaction memory pool size in MiB (Default is 300 MiB)
# Capping at 50 MiB saves ~250MB of RAM under heavy mempool pressure.
maxmempool=50

# Number of script verification threads (0 = auto, 1-16)
# Set to 2 to leave 2 CPU cores free for Linux networking, Wi-Fi driver, and Web HUD.
par=2

# Maximum peer connections (Default is 125)
# Set to 10 to minimize socket buffer and message queue allocations in RAM.
maxconnections=10

# --- Network & Server ---
# Server mode enables JSON-RPC for the display daemon & Web dashboard
daemon=0
server=1
listen=1
listenonion=0

# Local RPC interface
rpcport=8332
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcworkqueue=32
rpcthreads=4
rpctimeout=30

# --- Logging & DoS Protection ---
# Limit log file size to prevent SD card wear/fill-up
maxlogsize=10
shrinkdebuglog=1
