# Linux Kernel VM & Network Buffer Hardening for Orange Pi Zero 3 (1.5 GB RAM)
# Prevents Wi-Fi atomic allocation failures and enables auto-reboot on kernel panic

# Reserve 32 MB of atomic memory for network/Wi-Fi packet allocations
vm.min_free_kbytes = 32768

# ZRAM optimal swappiness for Linux 6.x
vm.swappiness = 180
vm.watermark_boost_factor = 0

# Prevent massive dirty memory write bursts to MicroSD (trickle writes every 5s)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_writeback_centisecs = 500

# Auto-reboot 10 seconds after kernel panic or oops (zero manual power cycles needed)
kernel.panic = 10
kernel.panic_on_oops = 1
