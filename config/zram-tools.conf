# Configuration for zram-tools on Orange Pi Zero 3 (1.5 GB RAM)
# Essential to prevent OOM killer during Bitcoin Initial Block Download (IBD)

# Compression algorithm (lz4 is fast with very low CPU overhead)
ALGO=lz4

# Allocate 100% of RAM (1536 MB) as compressed ZRAM swap
PERCENT=100

# Priority higher than disk swap
PRIORITY=100
